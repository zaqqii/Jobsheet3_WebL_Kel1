# Catatan pengalaman pengujian: Saat menguji endpoint /api/v1/login, /api/v1/products, dan /api/v1/transactions melalui Postman atau Insomnia, prosesnya terasa jauh lebih nyaman karena panel body, headers, dan authorization bisa diatur secara visual tanpa perlu mengingat flag seperti -X, -H, dan -d. Dengan curl, langkah pengujian terasa lebih rawan typo dan kurang efisien karena kita harus menulis request secara manual setiap kali, terutama saat menangani token bearer dan header Idempotency-Key untuk transaksi; di sisi lain, Postman/Insomnia memudahkan pengecekan status code, body respons, dan debugging regresi dalam satu tampilan yang lebih rapi dan terstruktur.
openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401":
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/v1/products:
    get:
      summary: Ambil daftar produk
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman untuk paginasi data
          required: false
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          description: Jumlah data produk per halaman
          required: false
          schema:
            type: integer
            example: 10
      responses:
        "200":
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        price: { type: integer }
                        category: { type: string }
        "401":
          description: Token tidak ada atau tidak valid
  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        "201":
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        "401":
          description: Token tidak ada atau tidak valid
        "422":
          description: Input tidak valid, misalnya product_id tidak ditemukan
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
